<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Example Template</title>
</head>
<style>
    body {
        width: 640px;
        height: 480px;
        background-image: url('assets/xibao.png');
        background-repeat: no-repeat;
        background-size: auto;
        background-color: black;
        margin: 0;
        padding: 0;
    }

    .root {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    * {
        font-family: 'Avenir', Helvetica, Arial, sans-serif;
    }
</style>
<body th:style="${'background-image: url(' + 'http://local-asset/xibao.png' + ');'}">
<div class="root">
    <div style="font-size: 30px; font-weight: bold;"
         th:text="'恭喜 ' + ${score.getUser().getUsername()} + ' (@' + ${name} + ')'">恭喜 Example (@Name)
    </div>
    <div th:text="
    '在 ' + ${score.getBeatmapset().getArtist()} +
    ' - ' + ${score.getBeatmapset().getTitle()} +
    ' [' + ${Osu.formatStarRating(score.getBeatmap().getDifficultyRating())} + '★ ' +
    ${score.getBeatmap().getVersion()} + '] 中'">
        在 Example Artist - Example Title [1.23★ Example Version] 中
    </div>
    <div style="font-size: 20px; font-weight: bold;" th:text="'使用 ' + ${Scores.getModString(score)} + ' 获得了'">使用
        [HDDT] 获得了
    </div>
    <div style="font-size: 40px; font-weight: bold;"
         th:text="${#numbers.formatInteger(score.getTotalScore(), 0, 'COMMA')} + ' (' + ${Osu.formatAccuracy(score.getAccuracy())} + ')'">
        123,456,789 (98.76%)
    </div>
    <div>的高分！</div>
</div>
</body>
</html>
